{% extends "base.html" %}
{% block content %}
    <h2>New meetup</h2>

    {% if errors %}
        <ul class="errors">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post" class="meetup-form">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" value="{{ title }}" required>

        <label for="event_date">Date</label>
        <input type="date" id="event_date" name="event_date" value="{{ event_date }}" required>

        <label for="details">Details</label>
        <textarea id="details" name="details" rows="6">{{ details }}</textarea>

        <button type="submit">Create meetup</button>
    </form>
{% endblock %}
