<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extra Pill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style id="app-style">
  :root {
    --bg: #f2f0f7;
    --surface: #ffffff;
    --text: #262138;
    --text-muted: #6d6787;
    --accent: #6c5ce8;
    --accent-strong: #5541c7;
    --accent-contrast: #f7f5ff;
    --border: #e3e0f0;
    --shadow: 255deg 25% 25%;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #131020;
      --surface: #1d1930;
      --text: #efeafb;
      --text-muted: #a79fc4;
      --accent: #a594fb;
      --accent-strong: #cabdfd;
      --accent-contrast: #1a1530;
      --border: #2c2645;
    }
  }

  :root[data-theme="dark"] {
    --bg: #131020;
    --surface: #1d1930;
    --text: #efeafb;
    --text-muted: #a79fc4;
    --accent: #a594fb;
    --accent-strong: #cabdfd;
    --accent-contrast: #1a1530;
    --border: #2c2645;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  main {
    width: min(400px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 26px;
    padding: 2.75rem 2.25rem 2.5rem;
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06), 0 20px 44px -22px hsl(var(--shadow) / 0.4);
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 1.75rem;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .count {
    font-family: "Bricolage Grotesque", "Sora", ui-sans-serif, sans-serif;
    font-weight: 700;
    font-size: clamp(5rem, 22vw, 7.5rem);
    line-height: 1;
    letter-spacing: -0.03em;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    text-wrap: balance;
  }

  .count-label {
    margin: 0.6rem 0 2.25rem;
    font-size: 0.95rem;
    color: var(--text-muted);
  }

  .add-btn {
    appearance: none;
    border: none;
    width: 100%;
    padding: 1.15rem 1.5rem;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-contrast);
    font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.08s ease;
  }

  .add-btn:hover { background: var(--accent-strong); }
  .add-btn:active { transform: scale(0.97); }

  .add-btn:disabled {
    opacity: 0.5;
    cursor: default;
    transform: none;
  }

  .add-btn:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 3px;
  }

  .reset-row { margin-top: 1.5rem; }

  .reset-btn {
    appearance: none;
    border: none;
    background: none;
    padding: 0.5rem 0.9rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.8rem;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    cursor: pointer;
    border-radius: 8px;
    transition: color 0.15s ease, background-color 0.15s ease;
  }

  .reset-btn:hover {
    color: var(--text);
    background: var(--bg);
  }

  .reset-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .reset-btn:focus-visible {
    outline: 2px solid var(--accent-strong);
    outline-offset: 2px;
  }

  .status {
    margin: 1.25rem 0 0;
    min-height: 1.1rem;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }

  .status[data-tone="warn"] { color: var(--accent-strong); }

  @media (prefers-reduced-motion: reduce) {
    .add-btn, .reset-btn { transition: none; }
  }
</style>
</head>
<body>
<main>
<p class="eyebrow">Extra Pill</p>
<div class="count" id="count" aria-live="polite">0</div>
<p class="count-label" id="countLabel">presses</p>
<button class="add-btn" id="addBtn" type="button">+1</button>
<div class="reset-row"><button class="reset-btn" id="resetBtn" type="button">Reset to 0</button></div>
<p class="status" id="status">&nbsp;</p>
</main>

<script type="application/json" id="seed">{"rev":0,"count":0}</script>

<script id="app-script">
(function () {
  var PENDING_KEY = "extraPill.pending";
  var LOCAL_KEY = "extraPill.local";
  var DEBOUNCE_MS = 1200;
  var FONT_URL = "https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Sora:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap";

  var BODY_MARKUP =
    '<main>\n' +
    '<p class="eyebrow">Extra Pill</p>\n' +
    '<div class="count" id="count" aria-live="polite">0</div>\n' +
    '<p class="count-label" id="countLabel">presses</p>\n' +
    '<button class="add-btn" id="addBtn" type="button">+1</button>\n' +
    '<div class="reset-row"><button class="reset-btn" id="resetBtn" type="button">Reset to 0</button></div>\n' +
    '<p class="status" id="status">&nbsp;</p>\n' +
    '</main>';

  var countEl = document.getElementById("count");
  var labelEl = document.getElementById("countLabel");
  var addBtn = document.getElementById("addBtn");
  var resetBtn = document.getElementById("resetBtn");
  var statusEl = document.getElementById("status");

  var api = null;
  var mode = "loading";
  var dirty = false;
  var retried = false;
  var timer = null;

  function normalize(raw) {
    var s = raw && typeof raw === "object" ? raw : {};
    var rev = typeof s.rev === "number" && s.rev >= 0 ? s.rev : 0;
    var count = typeof s.count === "number" && s.count >= 0 ? Math.floor(s.count) : 0;
    return { rev: rev, count: count };
  }

  function readSeed() {
    try { return normalize(JSON.parse(document.getElementById("seed").textContent)); }
    catch (e) { return { rev: 0, count: 0 }; }
  }

  function readPending() {
    try {
      var raw = sessionStorage.getItem(PENDING_KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function writePending(s) {
    try { sessionStorage.setItem(PENDING_KEY, JSON.stringify(s)); } catch (e) {}
  }

  function clearPending() {
    try { sessionStorage.removeItem(PENDING_KEY); } catch (e) {}
  }

  // Fallback used ONLY where this page cannot save server-side (e.g. the
  // static copy hosted on GitHub Pages, which has no Claude runtime).
  function readLocal() {
    try {
      var raw = localStorage.getItem(LOCAL_KEY);
      return raw ? normalize(JSON.parse(raw)) : null;
    } catch (e) { return null; }
  }

  function writeLocal(s) {
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); } catch (e) {}
  }

  function adoptLocal() {
    var local = readLocal();
    if (local && local.rev > state.rev) { state = local; dirty = false; }
  }

  var state = readSeed();
  var pending = readPending();
  if (pending && pending.rev > state.rev) {
    state = pending;
    dirty = true;
  } else {
    clearPending();
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function buildDocument(s) {
    var style = document.getElementById("app-style").textContent;
    var code = document.getElementById("app-script").textContent;
    return '<!doctype html>\n<html lang="en">\n<head>\n' +
      '<meta charset="utf-8">\n' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">\n' +
      '<title>Extra Pill</title>\n' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">\n' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n' +
      '<link href="' + escapeHtml(FONT_URL) + '" rel="stylesheet">\n' +
      '<style id="app-style">' + style + '</style>\n' +
      '</head>\n<body>\n' +
      BODY_MARKUP + '\n' +
      '<script type="application/json" id="seed">' + JSON.stringify(s) + '<\/script>\n' +
      '<script id="app-script">' + code + '<\/script>\n' +
      '</body>\n</html>\n';
  }

  function setStatus(text, tone) {
    statusEl.textContent = text;
    if (tone) statusEl.setAttribute("data-tone", tone);
    else statusEl.removeAttribute("data-tone");
  }

  function refreshStatus() {
    if (mode === "saving") return setStatus("Saving…");
    if (mode === "server") return setStatus(dirty ? "Unsaved" : "Saved to your Claude account");
    if (mode === "readonly") return setStatus("Read-only view — changes won't save", "warn");
    if (mode === "error") return setStatus("Couldn't save — press again to retry", "warn");
    if (mode === "local") return setStatus("Saved in this browser only", "warn");
    return setStatus(" ");
  }

  function render() {
    countEl.textContent = String(state.count);
    labelEl.textContent = state.count === 1 ? "press" : "presses";
    var locked = (mode === "readonly");
    addBtn.disabled = locked;
    resetBtn.disabled = locked;
    refreshStatus();
  }

  function schedule(delay) {
    clearTimeout(timer);
    timer = setTimeout(commit, mode === "local" ? 0 : delay);
  }

  function commit() {
    if (mode === "readonly") return;
    if (mode === "local") { writeLocal(state); dirty = false; refreshStatus(); return; }
    publishNow();
  }

  function publishNow() {
    if (!api || !dirty || mode === "readonly") return;
    mode = "saving";
    refreshStatus();
    writePending(state);

    api.publish(buildDocument(state)).then(function () {
      // The shell reloads this view to the new version.
    }, function (err) {
      var code = err && err.code;
      if (code === "conflict") return;              // shell reloads to the winner
      if (code === "rate_limited") { mode = "server"; schedule(5000); refreshStatus(); return; }
      if (code === "upstream_error" && !retried) {
        retried = true;
        mode = "server";
        schedule(1500 + Math.random() * 1500);
        refreshStatus();
        return;
      }
      if (code === "not_writer" || code === "not_granted" || code === "not_declared" ||
          code === "capability_disabled" || code === "capability_removed" || code === "consent_required") {
        mode = "readonly";
      } else {
        mode = "error";
      }
      clearPending();
      render();
    });
  }

  function change(nextCount, delay) {
    state = { rev: state.rev + 1, count: nextCount };
    dirty = true;
    retried = false;
    if (mode === "error") mode = "server";
    render();
    schedule(delay);
  }

  addBtn.addEventListener("click", function () { change(state.count + 1, DEBOUNCE_MS); });
  resetBtn.addEventListener("click", function () { change(0, 0); });

  render();

  if (window.claude && typeof window.claude.use === "function") {
    window.claude.use("artifact").then(function (ns) {
      api = ns;
      mode = ns ? "server" : "local";
      if (!ns) adoptLocal();
      render();
      if (dirty) schedule(0);
    }, function () {
      mode = "local";
      adoptLocal();
      render();
      if (dirty) schedule(0);
    });
  } else {
    mode = "local";
    adoptLocal();
    render();
    if (dirty) schedule(0);
  }
})();
</script>

</body>
</html>
