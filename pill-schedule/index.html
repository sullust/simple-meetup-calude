     (the `artifact` capability) with the updated entry list embedded — only works inside the Claude.ai Artifact runtime -->
<title>Pill Schedule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="app-style">
@import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@400;500&display=swap');

/* Layout: one column; a schedule strip, one card per medication (big take button + "next pill at"), history below. */
:root {
  --bg: #F2F5F4;
  --surface: #FFFFFF;
  --surface-alt: #E6ECEA;
  --border: #CFD9D5;
  --text: #15201D;
  --text-muted: #5E6E69;
  --accent: #1E6F5C;
  --accent-strong: #134D40;
  --accent-soft: #DCEDE7;
  --accent-contrast: #F4FBF8;
  --due: #B23A2E;
  --due-soft: #F8E5E2;
  --on-pill: #FFFFFF;
  --pill-aspirin: #B9412F;
  --pill-cephalexin: #1F6F8B;
  --pill-gabapentin: #8A6414;
  --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1715;
    --surface: #16211E;
    --surface-alt: #1E2B27;
    --border: #2D3D38;
    --text: #E6EEEB;
    --text-muted: #93A49E;
    --accent: #5FB89E;
    --accent-strong: #8FD4BE;
    --accent-soft: #1B3A32;
    --accent-contrast: #07140F;
    --due: #F08A7E;
    --due-soft: #3A1F1C;
    --on-pill: #FFFFFF;
    --pill-aspirin: #C9503D;
    --pill-cephalexin: #2A7F9C;
    --pill-gabapentin: #9A7320;
    color-scheme: dark;
  }
}

:root[data-theme="dark"] {
  --bg: #0F1715;
  --surface: #16211E;
  --surface-alt: #1E2B27;
  --border: #2D3D38;
  --text: #E6EEEB;
  --text-muted: #93A49E;
  --accent: #5FB89E;
  --accent-strong: #8FD4BE;
  --accent-soft: #1B3A32;
  --accent-contrast: #07140F;
  --due: #F08A7E;
  --due-soft: #3A1F1C;
  --on-pill: #FFFFFF;
  --pill-aspirin: #C9503D;
  --pill-cephalexin: #2A7F9C;
  --pill-gabapentin: #9A7320;
  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding-block: 28px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  gap: 22px;
}

.eyebrow {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 6px;
}

h1 {
  font-weight: 700;
  font-size: clamp(1.9rem, 6vw, 2.4rem);
  line-height: 1.05;
  letter-spacing: -0.01em;
  margin: 0 0 6px;
  text-wrap: balance;
}

.subhead {
  margin: 0;
  color: var(--text-muted);
  font-size: 0.95rem;
  max-width: 46ch;
}

#app { display: flex; flex-direction: column; gap: 22px; }

.banner {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 0.88rem;
  color: var(--text-muted);
}
.banner strong { color: var(--text); }

.strip {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  background: var(--accent-soft);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 16px;
}
.strip.due { background: var(--due-soft); }
.strip-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-muted);
}
.strip-value { font-weight: 700; font-size: 1.05rem; }
.strip.due .strip-value { color: var(--due); }

.meds { display: flex; flex-direction: column; gap: 14px; }

.med {
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 6px solid var(--pill);
  border-radius: 14px;
  padding: 16px 16px 14px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.med-head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.med-head h2 { margin: 0; font-size: 1.25rem; font-weight: 700; }
.med-sub { font-size: 0.85rem; color: var(--text-muted); }

.dots { display: flex; gap: 7px; align-items: center; }
.dot {
  width: 12px; height: 12px; border-radius: 50%;
  border: 2px solid var(--pill);
  background: transparent;
}
.dot.on { background: var(--pill); }
.dots .count {
  margin-left: 6px;
  font-family: var(--font-mono);
  font-size: 0.78rem;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}

.take {
  width: 100%;
  min-height: 68px;
  border: none;
  border-radius: 14px;
  background: var(--pill);
  color: var(--on-pill);
  font-family: var(--font-body);
  font-size: 1.25rem;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  box-shadow: 0 1px 0 rgba(0,0,0,0.06), 0 10px 22px -14px var(--pill);
  transition: transform 120ms ease, opacity 120ms ease;
}
.take:active:not(:disabled) { transform: scale(0.98); }
.take:focus-visible { outline: 3px solid var(--accent-strong); outline-offset: 3px; }
.take:disabled { opacity: 0.5; cursor: not-allowed; }
.take.done { background: var(--surface-alt); color: var(--text-muted); box-shadow: none; }
@media (prefers-reduced-motion: reduce) {
  .take { transition: none; }
  .take:active:not(:disabled) { transform: none; }
}

.next {
  margin: 0;
  font-size: 1rem;
  color: var(--text-muted);
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.next time, .next .when {
  font-family: var(--font-mono);
  font-size: 1.05rem;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.next.due { color: var(--due); }
.next.due .when { color: var(--due); font-weight: 500; }
.next .meta { font-size: 0.82rem; color: var(--text-muted); }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 14px; }
.card h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 12px; }
.day-group + .day-group { margin-top: 18px; }
.day-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin: 0 0 6px;
  display: flex; justify-content: space-between; gap: 8px;
}
.entry-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 2px; border-bottom: 1px solid var(--border);
}
.day-group:last-child .entry-row:last-child { border-bottom: none; }
.entry-main { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.entry-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--pill); flex: none; }
.entry-time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
.entry-name { font-size: 0.95rem; }
.entry-n { font-family: var(--font-mono); font-size: 0.75rem; color: var(--text-muted); }
.delete-btn {
  flex: none; width: 30px; height: 30px; border-radius: 50%; border: none; background: transparent;
  color: var(--text-muted); font-size: 1rem; line-height: 1; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.delete-btn:hover { background: var(--surface-alt); color: var(--text); }
.delete-btn:focus-visible { outline: 2px solid var(--accent-strong); outline-offset: 1px; }
.empty { color: var(--text-muted); font-size: 0.92rem; text-align: center; padding: 12px 0 4px; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  transform: translate(-50%, 12px);
  background: var(--text); color: var(--bg); font-size: 0.9rem; padding: 10px 16px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: opacity 160ms ease, transform 160ms ease; z-index: 10;
  max-width: calc(100vw - 32px); text-align: center;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
<div class="wrap">
  <header id="app-header">
    <p class="eyebrow">Bedtime 9:00 pm · count resets at midnight</p>
    <h1>Pill Schedule</h1>
    <p class="subhead">Tap a pill when you take it. The remaining doses for the day are spaced evenly between that tap and 9:00 pm.</p>
  </header>

  <script id="entries-data" type="application/json">[]</script>
  <div id="app"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script id="app-script">
(function () {
  // entries: [{ t: ISO timestamp, p: pill id }], oldest first
  var STORAGE_KEY = 'pill-schedule-entries-v1';
  var MAX_ENTRIES = 5000;
  var BEDTIME_HOUR = 21;          // 9:00 pm, local time
  var REPEAT_GUARD_MIN = 20;      // same pill within this many minutes asks for a second tap
  var CONFIRM_WINDOW_MS = 6000;
  var PILLS = [
    { id: 'aspirin',     name: 'Aspirin',     doses: 4 },
    { id: 'cephalexin',  name: 'Cephalexin',  doses: 4 },
    { id: 'gabapentin',  name: 'Gabapentin',  doses: 3 }
  ];
  var BY_ID = {};
  PILLS.forEach(function (p) { BY_ID[p.id] = p; });

  var appEl = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  var initialEntries = [];
  try {
    var parsed = JSON.parse(document.getElementById('entries-data').textContent || '[]');
    if (Array.isArray(parsed)) initialEntries = parsed.filter(function (e) { return e && e.t && BY_ID[e.p]; });
  } catch (e) {}

  var state = { entries: initialEntries };
  var readOnly = false;
  var busy = false;
  var localNoted = false;
  var pendingConfirm = null; // { id, until }

  var artifactPromise = (window.claude && typeof window.claude.use === 'function')
    ? window.claude.use('artifact')
    : Promise.resolve(null);

  artifactPromise.then(function (api) {
    if (!api) {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        var local = raw ? JSON.parse(raw) : null;
        if (Array.isArray(local)) { state.entries = local; render(); }
      } catch (e) {}
    }
  }, function () {});

  // ---- time helpers ----
  function fmtTime(d) {
    return new Date(d).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  }
  function startOfDay(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
  function dayKey(iso) {
    var d = new Date(iso);
    return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  }
  function dayLabel(iso) {
    var d = new Date(iso);
    var diff = Math.round((startOfDay(new Date()) - startOfDay(d)) / 86400000);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
  }
  function roundTo5Min(d) {
    var ms = 5 * 60000;
    return new Date(Math.round(d.getTime() / ms) * ms);
  }
  function fmtGap(ms) {
    var min = Math.max(0, Math.round(ms / 60000));
    var h = Math.floor(min / 60), m = min % 60;
    if (h === 0) return m + ' min';
    if (m === 0) return h + ' h';
    return h + ' h ' + m + ' min';
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function sorted(entries) {
    return entries.slice().sort(function (a, b) { return new Date(a.t) - new Date(b.t); });
  }

  // ---- schedule logic ----
  // Doses taken today for a pill, oldest first.
  function todayDoses(pillId, now) {
    var key = dayKey(now.toISOString());
    return sorted(state.entries).filter(function (e) { return e.p === pillId && dayKey(e.t) === key; });
  }

  // After each tap, the doses still owed today are spread evenly from that tap to 9:00 pm.
  // Returns { kind: 'first' | 'scheduled' | 'due' | 'done', at?: Date, gap?: ms, taken, doses }
  function nextDose(pill, now) {
    var today = todayDoses(pill.id, now);
    var taken = today.length;
    var base = { taken: taken, doses: pill.doses };
    if (taken === 0) return Object.assign({ kind: 'first' }, base);
    if (taken >= pill.doses) return Object.assign({ kind: 'done' }, base);
    var last = new Date(today[taken - 1].t);
    var bed = new Date(now.getFullYear(), now.getMonth(), now.getDate(), BEDTIME_HOUR, 0, 0, 0);
    var remaining = pill.doses - taken;
    var span = bed.getTime() - last.getTime();
    var gap = span > 0 ? span / remaining : 0;
    var at = roundTo5Min(new Date(last.getTime() + gap));
    if (at.getTime() <= now.getTime()) return Object.assign({ kind: 'due', at: at, gap: gap }, base);
    return Object.assign({ kind: 'scheduled', at: at, gap: gap }, base);
  }

  // The soonest thing to do across all pills, for the strip at the top.
  function overallNext(now) {
    var due = [], upcoming = [], firsts = [];
    PILLS.forEach(function (p) {
      var n = nextDose(p, now);
      if (n.kind === 'due') due.push({ pill: p, n: n });
      else if (n.kind === 'scheduled') upcoming.push({ pill: p, n: n });
      else if (n.kind === 'first') firsts.push({ pill: p, n: n });
    });
    if (due.length) {
      return { due: true, text: due.map(function (x) { return x.pill.name; }).join(' + ') + ' now' };
    }
    if (upcoming.length) {
      upcoming.sort(function (a, b) { return a.n.at - b.n.at; });
      var first = upcoming[0];
      var same = upcoming.filter(function (x) { return x.n.at.getTime() === first.n.at.getTime(); });
      return { due: false, text: same.map(function (x) { return x.pill.name; }).join(' + ') + ' at ' + fmtTime(first.n.at) };
    }
    if (firsts.length) return { due: false, text: 'First doses when you wake up' };
    return { due: false, text: 'All done for today' };
  }

  // ---- rendering ----
  function renderDots(n) {
    var html = '<div class="dots" aria-label="' + n.taken + ' of ' + n.doses + ' taken today">';
    for (var i = 0; i < n.doses; i++) html += '<span class="dot' + (i < n.taken ? ' on' : '') + '"></span>';
    html += '<span class="count">' + n.taken + ' of ' + n.doses + ' today</span></div>';
    return html;
  }

  function renderNext(n) {
    if (n.kind === 'first') {
      return '<p class="next">Next pill <span class="when">when you wake up</span></p>';
    }
    if (n.kind === 'done') {
      return '<p class="next">Done for today · next pill <span class="when">tomorrow morning</span></p>';
    }
    var meta = n.gap > 0 ? '<span class="meta">every ' + escapeHtml(fmtGap(n.gap)) + ' until 9:00 pm</span>' : '';
    if (n.kind === 'due') {
      return '<p class="next due">Next pill <span class="when">now</span>' +
        '<span class="meta">was due ' + escapeHtml(fmtTime(n.at)) + '</span></p>';
    }
    return '<p class="next">Next pill at <time datetime="' + n.at.toISOString() + '">' + escapeHtml(fmtTime(n.at)) + '</time>' + meta + '</p>';
  }

  function renderMeds(now) {
    var dis = (busy || readOnly) ? 'disabled' : '';
    var html = '<div class="meds">';
    PILLS.forEach(function (p) {
      var n = nextDose(p, now);
      var done = n.kind === 'done';
      html += '<section class="med" style="--pill: var(--pill-' + p.id + ')">' +
        '<div class="med-head"><h2>' + escapeHtml(p.name) + '</h2>' +
        '<span class="med-sub">' + p.doses + ' times daily</span></div>' +
        renderDots(n) +
        '<button class="take' + (done ? ' done' : '') + '" type="button" data-action="take" data-pill="' + p.id + '" ' + dis + '>' +
          (done ? 'Took all ' + p.doses + ' today' : 'Take ' + escapeHtml(p.name)) + '</button>' +
        renderNext(n) +
        '</section>';
    });
    return html + '</div>';
  }

  function renderLog() {
    var desc = sorted(state.entries).reverse();
    if (desc.length === 0) {
      return '<div class="card"><h2>Log</h2><p class="empty">Nothing logged yet. Tap a pill above when you take it.</p></div>';
    }
    var groups = [], byKey = {};
    desc.forEach(function (e) {
      var key = dayKey(e.t);
      if (!byKey[key]) { byKey[key] = { label: dayLabel(e.t), items: [] }; groups.push(byKey[key]); }
      byKey[key].items.push(e);
    });
    var html = '<div class="card"><h2>Log</h2>';
    groups.forEach(function (g) {
      // Number each dose within its day (1st, 2nd…) per pill, counted oldest first.
      var counts = {};
      var asc = g.items.slice().reverse();
      var nth = {};
      asc.forEach(function (e) { counts[e.p] = (counts[e.p] || 0) + 1; nth[e.t + e.p] = counts[e.p]; });
      var summary = PILLS.map(function (p) { return (counts[p.id] || 0) + '/' + p.doses + ' ' + p.name.slice(0, 3); }).join(' · ');
      html += '<div class="day-group"><p class="day-label"><span>' + escapeHtml(g.label) + '</span><span>' + escapeHtml(summary) + '</span></p>';
      g.items.forEach(function (e) {
        var p = BY_ID[e.p];
        var del = readOnly ? '' : '<button class="delete-btn" type="button" data-action="delete" data-ts="' + escapeHtml(e.t) + '" data-pill="' + e.p + '" aria-label="Remove this entry">×</button>';
        html += '<div class="entry-row" style="--pill: var(--pill-' + p.id + ')"><span class="entry-main">' +
          '<span class="entry-dot"></span>' +
          '<span class="entry-time">' + escapeHtml(fmtTime(e.t)) + '</span>' +
          '<span class="entry-name">' + escapeHtml(p.name) + '</span>' +
          '<span class="entry-n">' + nth[e.t + e.p] + ' of ' + p.doses + '</span>' +
          '</span>' + del + '</div>';
      });
      html += '</div>';
    });
    return html + '</div>';
  }

  function render() {
    var now = new Date();
    var banner = readOnly
      ? '<div class="banner"><span>🔒</span><span><strong>Read-only here.</strong> You can see this schedule, but only its owner can log pills.</span></div>'
      : '';
    var o = overallNext(now);
    var strip = '<div class="strip' + (o.due ? ' due' : '') + '"><span class="strip-label">Next pill</span>' +
      '<span class="strip-value">' + escapeHtml(o.text) + '</span></div>';
    appEl.innerHTML = banner + strip + renderMeds(now) + renderLog();
  }

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 3200);
  }

  // ---- persistence (the page republishes itself with the entries embedded) ----
  // Returns null if any piece of the page template is missing, so a broken copy is never published.
  function buildFullDocument(entries) {
    var styleEl = document.getElementById('app-style');
    var headerEl = document.getElementById('app-header');
    var scriptEl = document.getElementById('app-script');
    if (!styleEl || !headerEl || !scriptEl || !scriptEl.textContent) return null;
    return '<!doctype html><html><head><meta charset=utf8>' +
      '<meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">' +
      '<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}' +
      'body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>' +
      '</head><body>' +
      '<title>Pill Schedule</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' +
      styleEl.outerHTML + '\n<div class="wrap">\n' +
      headerEl.outerHTML + '\n' +
      '<script id="entries-data" type="application/json">' + JSON.stringify(entries) + '<\/script>\n' +
      '<div id="app"></div>\n' +
      '<div id="toast" class="toast" role="status" aria-live="polite"></div>\n' +
      '<script id="app-script">' + scriptEl.textContent + '<\/script>\n</div>\n</body></html>';
  }

  function save(successMessage, prevEntries) {
    return artifactPromise.then(function (api) {
      if (api) {
        var doc = buildFullDocument(state.entries);
        if (!doc) {
          state.entries = prevEntries; render();
          showToast("Couldn't save. Reload the page and try again.");
          return;
        }
        return api.publish(doc).then(function () {}, function (err) {
          var code = err && err.code;
          if (code === 'conflict') return; // view is reloading to the winner
          state.entries = prevEntries;
          if (code === 'not_writer' || code === 'not_granted' || code === 'consent_required' || code === 'not_declared') {
            readOnly = true; render();
            showToast('This schedule is read-only in your view.');
            return;
          }
          render();
          showToast("Couldn't save. Try again.");
        });
      }
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.entries)); } catch (e) {}
      if (!localNoted) {
        localNoted = true;
        showToast('Saved on this device only. Server sync is unavailable in this view.');
      } else if (successMessage) {
        showToast(successMessage);
      }
    });
  }

  function takePill(pillId) {
    if (busy || readOnly) return;
    var pill = BY_ID[pillId];
    if (!pill) return;
    var now = new Date();
    var today = todayDoses(pillId, now);
    var last = today.length ? new Date(today[today.length - 1].t) : null;
    var minsAgo = last ? (now - last) / 60000 : Infinity;
    var confirmed = pendingConfirm && pendingConfirm.id === pillId && pendingConfirm.until > now.getTime();
    if (minsAgo < REPEAT_GUARD_MIN && !confirmed) {
      pendingConfirm = { id: pillId, until: now.getTime() + CONFIRM_WINDOW_MS };
      showToast(pill.name + ' was logged ' + Math.round(minsAgo) + ' min ago. Tap again to log it anyway.');
      return;
    }
    pendingConfirm = null;
    busy = true;
    var iso = now.toISOString();
    var prev = state.entries;
    state.entries = prev.concat([{ t: iso, p: pillId }]).slice(-MAX_ENTRIES);
    render();
    var n = nextDose(pill, now);
    var msg = pill.name + ' logged at ' + fmtTime(iso) +
      (n.kind === 'scheduled' ? '. Next at ' + fmtTime(n.at) + '.' : n.kind === 'done' ? '. That is all for today.' : '.');
    save(msg, prev).then(function () {
      busy = false;
      if (!readOnly) render();
    });
  }

  function deleteEntry(ts, pillId) {
    if (readOnly) return;
    var prev = state.entries;
    state.entries = prev.filter(function (e) { return !(e.t === ts && e.p === pillId); });
    render();
    save('Removed', prev);
  }

  appEl.addEventListener('click', function (e) {
    var target = e.target.closest('[data-action]');
    if (!target) return;
    if (target.dataset.action === 'take') takePill(target.dataset.pill);
    if (target.dataset.action === 'delete') deleteEntry(target.dataset.ts, target.dataset.pill);
  });

  // Keep "now"/"due" states and the midnight reset current while the page stays open.
  setInterval(function () { if (!busy) render(); }, 60000);

  render();
})();
  </script>
</div>
