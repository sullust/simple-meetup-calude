     Storage (db) and downloads capabilities only work inside the Claude.ai Artifact runtime -->
<title>Sleepiness Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f7f3fb;
    --surface: #ffffff;
    --surface-sunk: #f1ecf9;
    --ink: #221b36;
    --ink-muted: #6e6685;
    --border: #e4def0;
    --accent: #5b4791;
    --accent-ink: #ffffff;

    --lvl1: #423876;
    --lvl2: #6653a8;
    --lvl3: #b98fa0;
    --lvl4: #e2a24d;
    --lvl5: #f3c43c;

    --lvl1-tint: #423876;
    --lvl2-tint: #6653a8;
    --lvl3-tint: #b98fa0;
    --lvl4-tint: #e2a24d;
    --lvl5-tint: #f3c43c;

    --shadow: 0 1px 2px rgba(34, 27, 54, 0.06), 0 8px 24px -12px rgba(34, 27, 54, 0.18);
    --radius-lg: 20px;
    --radius-md: 14px;
    --radius-sm: 9px;

    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16111f;
      --surface: #1f1830;
      --surface-sunk: #251c3a;
      --ink: #f1ecfb;
      --ink-muted: #a89ec4;
      --border: #362a52;
      --accent: #b6a3f0;
      --accent-ink: #201540;

      --lvl1: #8574d6;
      --lvl2: #a08ce0;
      --lvl3: #d3a4b6;
      --lvl4: #f0b465;
      --lvl5: #f6d158;

      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --paper: #16111f;
    --surface: #1f1830;
    --surface-sunk: #251c3a;
    --ink: #f1ecfb;
    --ink-muted: #a89ec4;
    --border: #362a52;
    --accent: #b6a3f0;
    --accent-ink: #201540;

    --lvl1: #8574d6;
    --lvl2: #a08ce0;
    --lvl3: #d3a4b6;
    --lvl4: #f0b465;
    --lvl5: #f6d158;

    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 1.25rem 1rem 3rem;
    display: flex;
    justify-content: center;
  }

  main {
    width: 100%;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
  }

  .eyebrow {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }

  h1 {
    margin: 0.3rem 0 0.25rem;
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    font-weight: 600;
    font-size: clamp(1.6rem, 5vw + 0.9rem, 2.15rem);
    line-height: 1.12;
    text-wrap: balance;
  }

  .subtitle {
    margin: 0;
    color: var(--ink-muted);
    font-size: 0.95rem;
  }

  #status-line {
    min-height: 1.3em;
    font-size: 0.88rem;
    color: var(--accent);
    font-weight: 500;
  }

  section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    padding: 1.15rem;
  }

  .buttons-row {
    display: flex;
    gap: 0.55rem;
  }

  .lvl-btn {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  .lvl-circle {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.3rem, 6vw, 1.7rem);
    border: 2px solid var(--lvl-color);
    background: color-mix(in srgb, var(--lvl-color) 16%, var(--surface));
    transition: transform 0.12s ease, background 0.12s ease;
  }

  .lvl-btn:nth-child(1) { --lvl-color: var(--lvl1); }
  .lvl-btn:nth-child(2) { --lvl-color: var(--lvl2); }
  .lvl-btn:nth-child(3) { --lvl-color: var(--lvl3); }
  .lvl-btn:nth-child(4) { --lvl-color: var(--lvl4); }
  .lvl-btn:nth-child(5) { --lvl-color: var(--lvl5); }

  .lvl-btn:active .lvl-circle {
    transform: scale(0.9);
    background: color-mix(in srgb, var(--lvl-color) 40%, var(--surface));
  }

  .lvl-btn.just-logged .lvl-circle {
    background: var(--lvl-color);
  }

  .lvl-btn:focus-visible .lvl-circle {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .lvl-label {
    font-size: 0.66rem;
    line-height: 1.15;
    text-align: center;
    color: var(--ink-muted);
    font-weight: 500;
  }

  h2 {
    margin: 0;
    font-family: "Fraunces", Georgia, serif;
    font-weight: 600;
    font-size: 1.05rem;
  }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 0.85rem;
  }

  .count-pill {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.72rem;
    color: var(--ink-muted);
    background: var(--surface-sunk);
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
  }

  .log-empty {
    color: var(--ink-muted);
    font-size: 0.9rem;
    padding: 0.5rem 0 0.25rem;
  }

  .log-list {
    display: flex;
    flex-direction: column;
    max-height: 21rem;
    overflow-y: auto;
  }

  .log-day-label {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.68rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-muted);
    padding: 0.7rem 0 0.35rem;
  }

  .log-day-label:first-child { padding-top: 0; }

  .log-row {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    padding: 0.5rem 0;
    border-top: 1px solid var(--border);
  }

  .log-day-label + .log-row { border-top: none; }

  .log-delete {
    flex: none;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.75rem;
    color: var(--ink-muted);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
    padding: 0.4rem 0.1rem;
    -webkit-tap-highlight-color: transparent;
  }

  .log-delete:hover,
  .log-delete:focus-visible {
    color: var(--accent);
  }

  .log-dot {
    width: 2rem;
    height: 2rem;
    border-radius: 50%;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.05rem;
    background: color-mix(in srgb, var(--dot-color) 20%, var(--surface));
    border: 1.5px solid var(--dot-color);
  }

  .log-text { flex: 1; min-width: 0; }

  .log-level {
    font-size: 0.88rem;
    font-weight: 500;
  }

  .log-time {
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  .export-toggle {
    width: 100%;
    background: var(--accent);
    color: var(--accent-ink);
    border: none;
    border-radius: var(--radius-md);
    padding: 0.8rem 1rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .export-toggle:active { opacity: 0.85; }

  #export-panel {
    margin-top: 1rem;
  }

  #export-panel[hidden] { display: none; }

  #export-text {
    width: 100%;
    resize: vertical;
    min-height: 9rem;
    max-height: 16rem;
    background: var(--surface-sunk);
    color: var(--ink);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0.75rem;
    font-family: "Space Mono", ui-monospace, monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    white-space: pre;
  }

  .export-actions {
    display: flex;
    gap: 0.55rem;
    margin-top: 0.7rem;
  }

  .export-actions button {
    flex: 1;
    font-family: inherit;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.6rem;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
  }

  .export-actions button:active { background: var(--surface-sunk); }

  .export-actions button.copied {
    border-color: var(--accent);
    color: var(--accent);
  }

  footer {
    text-align: center;
    font-size: 0.75rem;
    color: var(--ink-muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .lvl-circle { transition: none; }
  }
</style>

<main>
  <div>
    <div class="eyebrow" id="today-line">Loading&hellip;</div>
    <h1>How sleepy are you?</h1>
    <p class="subtitle">Tap a level to log it. Stored on the server, so it's the same list on every device.</p>
  </div>

  <section>
    <div class="buttons-row" id="buttons-row">
      <button class="lvl-btn" data-level="1" data-emoji="😴" data-label="Super Sleepy" aria-label="Log Super Sleepy">
        <span class="lvl-circle">😴</span>
        <span class="lvl-label">Super<br>Sleepy</span>
      </button>
      <button class="lvl-btn" data-level="2" data-emoji="😪" data-label="Sleepy" aria-label="Log Sleepy">
        <span class="lvl-circle">😪</span>
        <span class="lvl-label">Sleepy</span>
      </button>
      <button class="lvl-btn" data-level="3" data-emoji="😐" data-label="Neutral" aria-label="Log Neutral">
        <span class="lvl-circle">😐</span>
        <span class="lvl-label">Neutral</span>
      </button>
      <button class="lvl-btn" data-level="4" data-emoji="🙂" data-label="Awake" aria-label="Log Awake">
        <span class="lvl-circle">🙂</span>
        <span class="lvl-label">Awake</span>
      </button>
      <button class="lvl-btn" data-level="5" data-emoji="⚡" data-label="Super Awake" aria-label="Log Super Awake">
        <span class="lvl-circle">⚡</span>
        <span class="lvl-label">Super<br>Awake</span>
      </button>
    </div>
    <div id="status-line"></div>
  </section>

  <section>
    <div class="section-head">
      <h2>Log</h2>
      <span class="count-pill" id="count-pill">&hellip;</span>
    </div>
    <div id="log-list" class="log-list">
      <p class="log-empty">Loading your log&hellip;</p>
    </div>
  </section>

  <section>
    <button class="export-toggle" id="export-toggle">Export log as text</button>
    <div id="export-panel" hidden>
      <textarea id="export-text" readonly rows="8"></textarea>
      <div class="export-actions">
        <button id="copy-btn" type="button">Copy to clipboard</button>
        <button id="download-btn" type="button">Download .txt</button>
      </div>
    </div>
  </section>

  <footer id="db-footer">Connecting to storage&hellip;</footer>
</main>

<script>
  const LEVELS = {
    1: { emoji: "😴", label: "Super Sleepy" },
    2: { emoji: "😪", label: "Sleepy" },
    3: { emoji: "😐", label: "Neutral" },
    4: { emoji: "🙂", label: "Awake" },
    5: { emoji: "⚡", label: "Super Awake" },
  };

  const todayLineEl = document.getElementById("today-line");
  const statusLineEl = document.getElementById("status-line");
  const logListEl = document.getElementById("log-list");
  const countPillEl = document.getElementById("count-pill");
  const dbFooterEl = document.getElementById("db-footer");
  const buttonsRowEl = document.getElementById("buttons-row");
  const exportToggleEl = document.getElementById("export-toggle");
  const exportPanelEl = document.getElementById("export-panel");
  const exportTextEl = document.getElementById("export-text");
  const copyBtnEl = document.getElementById("copy-btn");
  const downloadBtnEl = document.getElementById("download-btn");

  const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: "long" });
  const dateFmt = new Intl.DateTimeFormat(undefined, { month: "short", day: "numeric", year: "numeric" });
  const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "numeric", minute: "2-digit" });

  todayLineEl.textContent = `${dayFmt.format(new Date())}, ${dateFmt.format(new Date())}`;

  let entries = [];
  let db = null;
  let downloads = null;

  function renderLog() {
    countPillEl.textContent = entries.length === 1 ? "1 entry" : `${entries.length} entries`;

    if (entries.length === 0) {
      logListEl.innerHTML = '<p class="log-empty">No entries yet. Tap a level above to log how you feel.</p>';
      return;
    }

    let html = "";
    let lastDate = null;
    for (const e of entries) {
      if (e.dateStr !== lastDate) {
        html += `<div class="log-day-label">${escapeHtml(e.dayOfWeek)}, ${escapeHtml(e.dateStr)}</div>`;
        lastDate = e.dateStr;
      }
      const lvl = LEVELS[e.level] || { emoji: "❔", label: "Unknown" };
      html += `
        <div class="log-row">
          <span class="log-dot" style="--dot-color: var(--lvl${e.level})">${lvl.emoji}</span>
          <span class="log-text">
            <div class="log-level">${escapeHtml(lvl.label)}</div>
            <div class="log-time">${escapeHtml(e.timeStr)}</div>
          </span>
          <button class="log-delete" type="button" data-id="${escapeHtml(e.id)}">Delete</button>
        </div>`;
    }
    logListEl.innerHTML = html;
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }

  function buildExportText() {
    const lines = [];
    lines.push("SLEEPINESS LOG");
    lines.push(`Exported ${dayFmt.format(new Date())}, ${dateFmt.format(new Date())} ${timeFmt.format(new Date())}`);
    lines.push("");

    if (entries.length === 0) {
      lines.push("(no entries yet)");
    } else {
      const chronological = [...entries].reverse();
      let lastDate = null;
      for (const e of chronological) {
        if (e.dateStr !== lastDate) {
          if (lastDate !== null) lines.push("");
          lines.push(`${e.dayOfWeek}, ${e.dateStr}`);
          lastDate = e.dateStr;
        }
        const lvl = LEVELS[e.level] || { emoji: "?", label: "Unknown" };
        lines.push(`  ${e.timeStr.padEnd(9)} ${lvl.emoji} ${lvl.label}`);
      }
    }
    return lines.join("\n");
  }

  async function logLevel(level) {
    const btn = buttonsRowEl.querySelector(`[data-level="${level}"]`);
    if (btn) {
      btn.classList.add("just-logged");
      setTimeout(() => btn.classList.remove("just-logged"), 260);
    }

    const now = new Date();
    const lvl = LEVELS[level];
    const entry = {
      level,
      emoji: lvl.emoji,
      label: lvl.label,
      ts: now.toISOString(),
      dayOfWeek: dayFmt.format(now),
      dateStr: dateFmt.format(now),
      timeStr: timeFmt.format(now),
    };

    if (!db) {
      statusLineEl.textContent = "Storage unavailable — not logged.";
      return;
    }

    try {
      await db.collection("entries").add(entry);
      statusLineEl.textContent = `Logged "${lvl.label}" at ${entry.timeStr}`;
    } catch (err) {
      statusLineEl.textContent = "Couldn't save that entry — try again.";
    }
  }

  buttonsRowEl.addEventListener("click", (ev) => {
    const btn = ev.target.closest(".lvl-btn");
    if (!btn) return;
    logLevel(Number(btn.dataset.level));
  });

  logListEl.addEventListener("click", async (ev) => {
    const btn = ev.target.closest(".log-delete");
    if (!btn || !db) return;
    btn.disabled = true;
    try {
      await db.collection("entries").doc(btn.dataset.id).delete();
    } catch (err) {
      statusLineEl.textContent = "Couldn't delete that entry — try again.";
      btn.disabled = false;
    }
  });

  exportToggleEl.addEventListener("click", () => {
    const willShow = exportPanelEl.hidden;
    exportPanelEl.hidden = !willShow;
    if (willShow) {
      exportTextEl.value = buildExportText();
    }
  });

  copyBtnEl.addEventListener("click", async () => {
    exportTextEl.value = buildExportText();
    try {
      await navigator.clipboard.writeText(exportTextEl.value);
      copyBtnEl.textContent = "Copied!";
      copyBtnEl.classList.add("copied");
    } catch (err) {
      exportTextEl.select();
      copyBtnEl.textContent = "Select & copy manually";
    }
    setTimeout(() => {
      copyBtnEl.textContent = "Copy to clipboard";
      copyBtnEl.classList.remove("copied");
    }, 1800);
  });

  downloadBtnEl.addEventListener("click", async () => {
    exportTextEl.value = buildExportText();
    if (!downloads) {
      downloadBtnEl.textContent = "Unavailable here";
      setTimeout(() => { downloadBtnEl.textContent = "Download .txt"; }, 1800);
      return;
    }
    try {
      await downloads.save({ filename: "sleepiness-log.txt", data: exportTextEl.value });
    } catch (err) {
      // declined or unavailable — no action needed
    }
  });

  (async () => {
    db = await window.claude?.use ? await window.claude.use("db") : null;
    if (!db) {
      dbFooterEl.textContent = "Storage isn't available in this view — entries won't be saved.";
      entries = [];
      renderLog();
      return;
    }
    dbFooterEl.textContent = "Synced to server storage.";
    db.collection("entries").orderBy("ts", "desc").limit(500).onSnapshot(
      (snap) => {
        entries = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderLog();
      },
      (err) => {
        dbFooterEl.textContent = "Lost connection to storage.";
      }
    );
  })();

  (async () => {
    downloads = window.claude?.use ? await window.claude.use("downloads") : null;
  })();
</script>
