<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Last Shower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Karla:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f4f1ea;
    --bg-deep: #ece7dc;
    --surface: #ffffff;
    --text: #23302e;
    --text-muted: #5c6e6a;
    --accent: #1c8781;
    --accent-strong: #106661;
    --accent-soft: #d9ece9;
    --border: #dcdfd3;
    --shadow: 22deg 20% 30%;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101817;
      --bg-deep: #0a1211;
      --surface: #17211f;
      --text: #e9f1ee;
      --text-muted: #93a8a3;
      --accent: #57d6c9;
      --accent-strong: #8ce8de;
      --accent-soft: #1c3733;
      --border: #263532;
    }
  }

  :root[data-theme="dark"] {
    --bg: #101817;
    --bg-deep: #0a1211;
    --surface: #17211f;
    --text: #e9f1ee;
    --text-muted: #93a8a3;
    --accent: #57d6c9;
    --accent-strong: #8ce8de;
    --accent-soft: #1c3733;
    --border: #263532;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: "Karla", ui-sans-serif, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    position: relative;
    overflow-x: hidden;
  }

  .atmosphere {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .drop {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, var(--accent-soft), transparent 70%);
    opacity: 0.55;
    filter: blur(2px);
  }

  .drop.one   { width: 42vmax; height: 42vmax; top: -18vmax; right: -14vmax; }
  .drop.two   { width: 26vmax; height: 26vmax; bottom: -12vmax; left: -10vmax; opacity: 0.4; }
  .drop.three { width: 14vmax; height: 14vmax; top: 60%; right: 8%; opacity: 0.3; }

  @media (prefers-reduced-motion: no-preference) {
    .drop { animation: drift 22s ease-in-out infinite alternate; }
    .drop.two { animation-duration: 26s; }
    .drop.three { animation-duration: 18s; }
  }

  @keyframes drift {
    from { transform: translate(0, 0) scale(1); }
    to   { transform: translate(1.5%, 2%) scale(1.04); }
  }

  main {
    position: relative;
    z-index: 1;
    width: min(420px, 100%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 22px;
    padding: 2.75rem 2.25rem 2.25rem;
    box-shadow: 0 1px 2px hsl(var(--shadow) / 0.06), 0 18px 40px -20px hsl(var(--shadow) / 0.35);
    text-align: center;
  }

  .eyebrow {
    margin: 0 0 1.5rem;
    font-family: "Karla", sans-serif;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .count-row {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.5rem;
    line-height: 1;
    flex-wrap: wrap;
  }

  .count {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(4.5rem, 16vw, 6.5rem);
    letter-spacing: -0.02em;
    color: var(--text);
    text-wrap: balance;
    font-variant-numeric: tabular-nums;
  }

  .count-unit {
    font-family: "Karla", sans-serif;
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text-muted);
    padding-bottom: 0.6rem;
  }

  .count-word {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(2.4rem, 9vw, 3rem);
    color: var(--text);
  }

  .since {
    margin: 0.25rem 0 1.75rem;
    color: var(--text-muted);
    font-size: 0.95rem;
  }

  .example-tag {
    display: inline-block;
    font-size: 0.78rem;
    font-style: italic;
    color: var(--text-muted);
    opacity: 0.8;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 1.75rem;
  }

  .stamp {
    display: inline-flex;
    align-items: baseline;
    gap: 0.55rem;
    margin: 0 0 2rem;
    padding: 0.6rem 1rem;
    background: var(--bg-deep);
    border-radius: 10px;
    font-family: "IBM Plex Mono", ui-monospace, monospace;
  }

  .stamp-day {
    color: var(--text-muted);
    font-size: 0.78rem;
    letter-spacing: 0.04em;
  }

  .stamp-date {
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 500;
  }

  button {
    appearance: none;
    border: none;
    width: 100%;
    padding: 1rem 1.25rem;
    border-radius: 12px;
    background: var(--accent);
    color: #04211f;
    font-family: "Karla", sans-serif;
    font-size: 1.02rem;
    font-weight: 700;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background-color 0.15s ease, transform 0.1s ease;
    position: relative;
    overflow: hidden;
  }

  button:hover { background: var(--accent-strong); }
  button:active { transform: scale(0.98); }

  button:focus-visible {
    outline: 3px solid var(--accent-strong);
    outline-offset: 3px;
  }

  .confirm {
    margin: 0.9rem 0 0;
    min-height: 1.2rem;
    font-size: 0.85rem;
    color: var(--accent-strong);
    opacity: 0;
    transform: translateY(-2px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .confirm.show {
    opacity: 1;
    transform: translateY(0);
  }

  @media (prefers-reduced-motion: reduce) {
    .confirm { transition: none; }
  }
</style>
</head>
<body>
<div class="atmosphere" aria-hidden="true">
  <div class="drop one"></div>
  <div class="drop two"></div>
  <div class="drop three"></div>
</div>

<main>
  <p class="eyebrow">Last Shower</p>

  <div id="countDisplay">
    <div class="count-row">
      <span class="count" id="countNumber">—</span>
      <span class="count-unit" id="countUnit"></span>
    </div>
    <p class="since" id="sinceLine">No shower logged yet.</p>
  </div>

  <div class="divider"></div>

  <div class="stamp">
    <span class="stamp-day" id="stampDay">Last logged</span>
    <span class="stamp-date" id="stampDate">&nbsp;</span>
  </div>

  <button id="logButton" type="button">I took a shower</button>
  <p class="confirm" id="confirmMsg" role="status" aria-live="polite">Logged. Nice and clean.</p>
</main>

<script>
  (function () {
    var STORAGE_KEY = "lastShowerDate";
    var EXAMPLE_ISO = "2026-08-20";
    var countNumber = document.getElementById("countNumber");
    var countUnit = document.getElementById("countUnit");
    var countDisplay = document.getElementById("countDisplay");
    var sinceLine = document.getElementById("sinceLine");
    var stampDay = document.getElementById("stampDay");
    var stampDate = document.getElementById("stampDate");
    var logButton = document.getElementById("logButton");
    var confirmMsg = document.getElementById("confirmMsg");
    var confirmTimer = null;

    function todayISO() {
      var d = new Date();
      d.setHours(0, 0, 0, 0);
      var y = d.getFullYear();
      var m = String(d.getMonth() + 1).padStart(2, "0");
      var day = String(d.getDate()).padStart(2, "0");
      return y + "-" + m + "-" + day;
    }

    function readStored() {
      try {
        return localStorage.getItem(STORAGE_KEY);
      } catch (e) {
        return null;
      }
    }

    function writeStored(iso) {
      try {
        localStorage.setItem(STORAGE_KEY, iso);
      } catch (e) {
        /* private mode / storage blocked: state just won't survive reload */
      }
    }

    function daysBetween(isoEarlier, isoLater) {
      var a = new Date(isoEarlier + "T00:00:00");
      var b = new Date(isoLater + "T00:00:00");
      return Math.round((b - a) / 86400000);
    }

    function relativeLabel(n) {
      if (n <= 0) return "Today";
      if (n === 1) return "Yesterday";
      return n + " days ago";
    }

    function render() {
      var today = todayISO();
      var stored = readStored();
      var isExample = !stored;
      if (isExample) stored = EXAMPLE_ISO;

      var n = daysBetween(stored, today);
      stampDay.textContent = isExample ? "Example" : "Last logged";
      stampDate.textContent = relativeLabel(n);
      var suffix = isExample ? ' <span class="example-tag">(example — press the button below)</span>' : '';

      if (n <= 0) {
        countDisplay.innerHTML = '<div class="count-row"><span class="count-word">Today</span></div>' +
          '<p class="since">You’re all fresh.' + suffix + '</p>';
      } else if (n === 1) {
        countDisplay.innerHTML = '<div class="count-row"><span class="count-word">Yesterday</span></div>' +
          '<p class="since">One day and counting.' + suffix + '</p>';
      } else {
        countDisplay.innerHTML =
          '<div class="count-row"><span class="count">' + n + '</span>' +
          '<span class="count-unit">days ago</span></div>' +
          '<p class="since">Might be time for another.' + suffix + '</p>';
      }
    }

    logButton.addEventListener("click", function () {
      writeStored(todayISO());
      render();
      confirmMsg.classList.remove("show");
      void confirmMsg.offsetWidth;
      confirmMsg.classList.add("show");
      clearTimeout(confirmTimer);
      confirmTimer = setTimeout(function () {
        confirmMsg.classList.remove("show");
      }, 2400);
    });

    render();
  })();
</script>

</body>
</html>
