name: Deploy icon demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "home-screen-icon-demo/**"
      - "drink-log/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r home-screen-icon-demo/icons home-screen-icon-demo/manifest.webmanifest _site/
          cp home-screen-icon-demo/icons/apple-touch-icon.png _site/apple-touch-icon.png
          # The artifact source omits the document skeleton; add one so the icon links land in <head>.
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            cat home-screen-icon-demo/index.html
            printf '\n</html>\n'
          } > _site/index.html
          # Drink Log: the real app served at /drink-log/ with Home Screen icon tags in <head>.
          # (Outside the Claude.ai runtime it stores entries in localStorage on that device.)
          mkdir -p _site/drink-log
          cp -r drink-log/icons drink-log/manifest.webmanifest _site/drink-log/
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            printf '<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">\n'
            printf '<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">\n'
            printf '<link rel="manifest" href="manifest.webmanifest">\n'
            printf '<meta name="apple-mobile-web-app-capable" content="yes">\n<meta name="mobile-web-app-capable" content="yes">\n'
            printf '<meta name="apple-mobile-web-app-title" content="Drink Log">\n'
            printf '<meta name="apple-mobile-web-app-status-bar-style" content="default">\n'
            printf '<meta name="theme-color" content="#2F6F8F">\n'
            cat drink-log/index.html
            printf '\n</html>\n'
          } > _site/drink-log/index.html
          ls -R _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
