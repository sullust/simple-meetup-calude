name: Deploy icon demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "home-screen-icon-demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp -r home-screen-icon-demo/icons home-screen-icon-demo/manifest.webmanifest _site/
          cp home-screen-icon-demo/icons/apple-touch-icon.png _site/apple-touch-icon.png
          # The artifact source omits the document skeleton; add one so the icon links land in <head>.
          {
            printf '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n'
            printf '<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'
            cat home-screen-icon-demo/index.html
            printf '\n</html>\n'
          } > _site/index.html
          ls -R _site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
