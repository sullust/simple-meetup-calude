<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drink Log</title>
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drink Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#2F6F8F">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #2F6F8F; color: #F7FBFD;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { display: grid; gap: 16px; justify-items: center; padding: 24px; }
  img { width: 120px; height: 120px; border-radius: 27px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { margin: 0; font-size: 1.8rem; }
  p { margin: 0; max-width: 28ch; opacity: .85; }
  a { color: #1F5470; background: #F7FBFD; padding: 14px 28px; border-radius: 999px; font-weight: 600; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="icons/apple-touch-icon.png" width="120" height="120" alt="Drink Log icon">
  <h1>Drink Log</h1>
  <p>Share, then Add to Home Screen. Launching from the icon opens the log.</p>
  <a id="open" href="https://claude.ai/artifact/53oDJzYMn6i1K5jqJxiiyu">Open Drink Log</a>
</main>
<script>
  // Launched from the Home Screen icon: go straight to the log. In a normal browser tab, stay here
  // so the page can be added to the Home Screen.
  if (navigator.standalone || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) {
    location.replace(document.getElementById('open').href);
  }
</script>
</body>
</html>
